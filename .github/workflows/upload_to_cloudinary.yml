name: Upload new ph images to Cloudinary

on:
  push:
    paths:
      - 'ph/**'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install cloudinary
        run: pip install cloudinary

      - name: Upload new images
        env:
          CLOUD_NAME: dhuvuhjcu
          API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python - <<'EOF'
          import os, re, cloudinary, cloudinary.uploader, cloudinary.api
          from pathlib import Path
          cloudinary.config(cloud_name=os.environ['CLOUD_NAME'], api_key=os.environ['API_KEY'], api_secret=os.environ['API_SECRET'], secure=True)
          isbn_re = re.compile(r'^\d{13}$')
          for jpg in Path('ph').glob('*.jpg'):
              isbn = jpg.stem
              if not isbn_re.match(isbn):
                  print(f"SKIP(bad name): {jpg.name}")
                  continue
              public_id = f"ph/{isbn}"
              try:
                  cloudinary.api.resource(public_id)
                  print(f"SKIP: {isbn}")
              except Exception:
                  cloudinary.uploader.upload(str(jpg), public_id=public_id, overwrite=False)
                  print(f"OK: {isbn}")
          EOF
