<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISBN Image Search</title>
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--accent:#00ff88;--accent2:#0088ff;--text:#e8e8e8;--muted:#555;--error:#f44;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;}
h1{font-size:24px;letter-spacing:.15em;color:var(--accent);margin-bottom:8px;}
.sub{font-size:13px;color:var(--muted);margin-bottom:40px;}
.row{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;max-width:520px;width:100%;}
.pre{background:var(--surface);border-right:1px solid var(--border);padding:14px 16px;font-size:13px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;}
input{flex:1;background:var(--surface);border:none;outline:none;padding:14px 16px;font-size:20px;color:var(--text);letter-spacing:.2em;min-width:0;}
button{background:var(--accent);color:#000;border:none;padding:14px 24px;font-size:13px;font-weight:700;cursor:pointer;}
.hint{margin-top:8px;font-size:11px;color:var(--muted);text-align:center;max-width:520px;width:100%;margin-bottom:24px;}
.results{width:100%;max-width:520px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:16px;}
.ch{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.isbn{font-size:13px;color:var(--accent);letter-spacing:.1em;}
.badge{font-size:10px;color:var(--accent);border:1px solid var(--accent);padding:2px 8px;border-radius:2px;}
.iw{padding:24px;display:flex;justify-content:center;background:#0d0d0d;}
.iw img{max-width:100%;max-height:360px;object-fit:contain;}
.cf{padding:12px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);word-break:break-all;}
.msg{text-align:center;padding:48px 24px;font-size:13px;}
.err{color:var(--error);}
.load{color:var(--accent2);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
</style>
</head>
<body>
<h1>ISBN_IMAGE_SEARCH</h1>
<div class="sub">97848772 + [4 digits] = product image</div>
<div class="row">
<div class="pre">97848772 -</div>
<input type="text" id="inp" maxlength="4" placeholder="3348" inputmode="numeric" />
<button onclick="go()">Search</button>
</div>
<div class="hint">Enter digits 9-12 of ISBN (4 digits)</div>
<div class="results" id="res"></div>
<script>
var CN="dhuvuhjcu";
var db=[];
fetch("isbn_list.json").then(function(r){return r.json();}).then(function(d){db=d;}).catch(function(){db=[];});
var inp=document.getElementById("inp");
var res=document.getElementById("res");
inp.addEventListener("input",function(){
  inp.value=inp.value.replace(/[^0-9]/g,"").slice(0,4);
  if(inp.value.length===4)go();
});
inp.addEventListener("keydown",function(e){if(e.key==="Enter")go();});
function go(){
  var four=inp.value.trim();
  if(!four)return;
  var hits=db.filter(function(i){return i.slice(8,12)===four;});
  if(hits.length===0){res.innerHTML="<div class=\"msg err\">No image found: 97848772"+four+"</div>";return;}
  if(hits.length===1){show(hits[0]);}else{grid(hits);}
}
function show(isbn){
  var url="https://res.cloudinary.com/"+CN+"/image/upload/ph/"+isbn+".jpg";
  res.innerHTML="<div class=\"msg load\">Loading...</div>";
  var img=new Image();
  img.onload=function(){res.innerHTML="<div class=\"card\"><div class=\"ch\"><span class=\"isbn\">"+isbn+"</span><span class=\"badge\">FOUND</span></div><div class=\"iw\"><img src=\""+url+"\" /></div><div class=\"cf\">"+url+"</div></div>";};
  img.onerror=function(){res.innerHTML="<div class=\"msg err\">Error: "+isbn+"</div>";};
  img.src=url;
}
function grid(isbns){
  var h="<div style=\"font-size:11px;color:var(--muted);margin-bottom:16px;text-align:center\">"+isbns.length+" results</div><div class=\"grid\">";
  for(var x=0;x<isbns.length;x++){
    var isbn=isbns[x];
    var url="https://res.cloudinary.com/"+CN+"/image/upload/ph/"+isbn+".jpg";
    h+="<div class=\"card\" style=\"cursor:pointer\" onclick=\"show('"+isbn+"')\" >";
    h+="<div class=\"ch\" style=\"padding:10px 14px\"><span class=\"isbn\" style=\"font-size:11px\">"+isbn+"</span></div>";
    h+="<div class=\"iw\" style=\"padding:16px\"><img src=\""+url+"\" style=\"max-height:180px\" onerror=\"this.style.display='none'\" /></div></div>";
  }
  h+="</div>";
  res.innerHTML=h;
}
</script>
</body>
</html>
